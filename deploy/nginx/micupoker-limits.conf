# MicuPoker — http-context directives.
# Install as /etc/nginx/conf.d/micupoker-limits.conf
#
# These have to live in the http context, so they cannot sit inside the vhost.
# The Cloudflare real-IP and origin-guard blocks are shared across every site on
# this host and are NOT duplicated here; see conf.d/cloudflare-realip.conf and
# conf.d/cloudflare-origin-guard.conf.

# $remote_addr is already the true client address at this point: the realip
# module rewrote it from CF-Connecting-IP, but only for peers inside the
# Cloudflare ranges. A direct hit on the origin is keyed by its own address, so
# an attacker cannot get a fresh bucket by forging a header.

# Login and registration. Deliberately tight: every request here burns ~200ms of
# CPU on PBKDF2, so this doubles as protection against a CPU exhaustion attack.
limit_req_zone $binary_remote_addr zone=micupoker_auth:10m rate=12r/m;

# Room creation and joins — these write to the database and count against
# MAX_ROOMS.
limit_req_zone $binary_remote_addr zone=micupoker_write:10m rate=30r/m;

# Read-only JSON endpoints. Generous enough for a polling dashboard.
limit_req_zone $binary_remote_addr zone=micupoker_api:10m rate=120r/m;

# Everything else, including page loads and the initial WebSocket upgrade.
limit_req_zone $binary_remote_addr zone=micupoker_general:10m rate=300r/m;

# One player normally holds one WebSocket plus a couple of short-lived HTTP
# connections. This stops a single host from parking thousands of sockets.
limit_conn_zone $binary_remote_addr zone=micupoker_conn:10m;

# The app applies the same limits itself (see MicuPokerWeb.Plugs.RateLimit), so
# a misconfigured proxy cannot leave the endpoints unprotected. nginx sheds the
# load before it reaches the BEAM; the app is the backstop.

# `proxy_set_header Connection "upgrade"` unconditionally is wrong: it tells the
# upstream to upgrade plain HTTP requests too. This maps the header through so
# only real WebSocket handshakes carry it.
map $http_upgrade $micupoker_connection_upgrade {
    default upgrade;
    ''      close;
}

# Phoenix validates hostile Origin values but, like most WebSocket servers,
# accepts clients that omit Origin entirely. Browsers always send it. Reject
# missing and unknown origins at the only public ingress so non-browser clients
# cannot bypass the cross-site WebSocket control.
map $http_origin $micupoker_websocket_origin_allowed {
    default                     0;
    "https://poker.micutu.com"  1;
}
