# MicuPoker — nginx vhost.
# Install as /etc/nginx/sites-available/poker.micutu.com and symlink into
# sites-enabled. Requires conf.d/micupoker-limits.conf for the zones and the
# $micupoker_connection_upgrade map.
#
# Request path: client -> nginx (this file) -> Bandit on 127.0.0.1:4100.
# The release never listens on a public interface.
#
# NOTE: poker.micutu.com is currently a DNS-only record — it resolves straight
# to this host's public address, not to Cloudflare. Verify before assuming
# otherwise:
#
#   dig +short poker.micutu.com A      # this host  => direct
#                                      # 104.x/172.x => proxied
#
# That is why the Cloudflare origin guard below is commented out. Enabling it
# while the record is grey-clouded returns 444 to every real visitor.

server {
    listen 80;
    listen [::]:80;
    server_name poker.micutu.com;

    # Certbot renewals are the only thing that may reach plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name poker.micutu.com;

    ssl_certificate /etc/letsencrypt/live/poker.micutu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/poker.micutu.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Origin guard. Enable ONLY once poker.micutu.com is orange-clouded in
    # Cloudflare; see the note at the top of this file. It tests
    # $realip_remote_addr — the actual TCP peer, captured before the realip
    # module rewrites $remote_addr — so a forged CF-Connecting-IP cannot get
    # past it. Loopback stays allowed for scripts/deploy_check.sh.
    #
    # if ($from_cloudflare_origin = 0) {
    #     return 444;
    # }

    # No upload endpoint exists. The largest legitimate body is a login form.
    client_max_body_size 64k;

    # Slowloris: a client that dribbles out a request header or body byte by
    # byte holds a worker. WebSocket traffic is unaffected — these cover the
    # HTTP request phase only, before the upgrade completes.
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;

    limit_conn micupoker_conn 24;

    # 503 is the nginx default and reads as "the app is down". 429 is what a
    # throttled client should see, and it is what Cloudflare and monitoring
    # treat as backpressure rather than an outage.
    limit_req_status 429;
    limit_conn_status 429;

    # Do not advertise the nginx version on error pages.
    server_tokens off;

    access_log /var/log/nginx/poker.micutu.com.access.log;
    error_log /var/log/nginx/poker.micutu.com.error.log warn;

    # Every proxy_pass block below sets CF-Connecting-IP to $remote_addr. That
    # is not decoration: it overwrites whatever the client sent. With a
    # grey-clouded origin the app's peer is always loopback, which is trusted,
    # so a request carrying its own CF-Connecting-IP would otherwise choose its
    # own identity and walk through every per-IP rate limit. Do not remove it.

    # MicuPokerWeb.Plugs.SecurityHeaders emits CSP, HSTS, Referrer-Policy,
    # Permissions-Policy and the cross-origin isolation headers itself, and
    # Phoenix emits X-Frame-Options and X-Content-Type-Options. nginx must not
    # add its own: duplicated headers arrive as "DENY, DENY", which some
    # browsers reject as malformed and then ignore entirely. The app is the
    # single source of truth so that a local run is as hardened as production.

    # LiveView and the table channel. Long timeouts, no request-rate limit — a
    # WebSocket is one request that then stays open for the whole session — but
    # the connection limit above still applies.
    location ~ ^/(live|socket)/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $micupoker_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $remote_addr;

        # A hand can idle for minutes between actions; the client heartbeat is
        # the liveness signal, not traffic.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Frames must reach the player as they are produced.
        proxy_buffering off;
    }

    # Digested assets are content-addressed and immutable. Phoenix already sets
    # the right cache headers; this only keeps nginx from second-guessing them.
    location /assets/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=micupoker_general burst=120 nodelay;
    }

    # Password hashing is intentionally expensive, so this is the cheapest
    # endpoint to weaponise. burst=5 absorbs a fat-fingered password without
    # letting anyone grind through a wordlist.
    location ~ ^/(login|register)$ {
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $remote_addr;
        limit_req zone=micupoker_auth burst=5 nodelay;
    }

    # Room creation and joins write rows and consume table slots.
    location /rooms {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $remote_addr;
        limit_req zone=micupoker_write burst=15 nodelay;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $remote_addr;
        limit_req zone=micupoker_api burst=40 nodelay;
    }

    # Uptime probes should not be throttled or logged.
    location = /health {
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $micupoker_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        limit_req zone=micupoker_general burst=60 nodelay;
    }

    # A shed request should read as a shed request, not as an app error.
    error_page 429 = @ratelimited;

    location @ratelimited {
        default_type text/plain;
        add_header Retry-After 30 always;
        return 429 "Too many requests. Slow down and try again.\n";
    }
}
